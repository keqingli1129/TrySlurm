# Practice cluster: 1 controller container + 2 compute containers (c1, c2), CPU only.
ClusterName=dockerlab
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
# No log files set: the daemons log to the container output (docker compose logs).

ProctrackType=proctrack/linuxproc
MpiDefault=none
ReturnToService=2
# Trust the CPU/memory numbers below instead of what each container sees on the host.
SlurmdParameters=config_overrides

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU

NodeName=c[1-2] CPUs=4 RealMemory=2000 State=UNKNOWN
PartitionName=debug Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP
